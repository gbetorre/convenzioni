description:
  it:
    genericName: Applicazione Web
    localisedName: "COL-GeCo: Convenzioni On Line-Gestione Convenzioni"
    shortDescription: 'Applicazione web per la gestione delle convenzioni della pubblica amministrazione.'
    longDescription: |
      ## Presentazione
      
      Il software gestionale delle convenzioni (COL-GECO, ovvero Convenzioni On Line-Gestione Convenzioni) 
      è un software modulare che nasce dall’esigenza, interna alla Pubblica Amministrazione, di tracciare 
      accordi e convenzioni intercorrenti tra soggetti esterni e la PA stessa, 
      sia allo scopo di redigere un registro organizzato e sempre aggiornato, 
      sia al fine di ottenere uno scadenzario atto a informare e notificare 
      circa le prossime convenzioni in scadenza e in grado di erogare riepiloghi mensili 
      e fornire remind riguardo le scadenze imminenti.
      
      
      ## Storia
      
      Originariamente, la richiesta di sviluppare un software ad-hoc è partita 
      dall’esigenza degli uffici, che non trovavano sufficiente appoggiarsi 
      ad uno strumento predefinito, in quanto, per tracciare le scadenze
      delle convenzioni gestite e attivare meccanismi di alert riguardo
      le operazioni da mettere in atto per effettuare i rinnovi delle convenzioni
      esistenti, già utilizzavano tipicamente, oltre a calendari e applicazioni, 
      anche le cartelle Excel.
      
      Tuttavia, un software come COL-GECO rappresenta invece un hub unico in cui, 
      una volta inserite le informazioni relative alle convenzioni, 
      tutto il workflow procede di conseguenza e senza necessità di ulteriore 
      intervento da parte degli operatori, che ricevono progressivamente
      le informazioni necessarie man mano che il tempo passa e le _deadline_
      si avvicinano.  
      
      
      ## Oggetto di studio

      Attualmente, l'oggetto del software è la gestione delle convenzioni, 
      ma il software stesso è concepito con la mission di estendere progressivamente 
      il dominio agli altri oggetti di contratto e accordo con la PA (ad
      esempio: incarichi, accordi, collegi direttivi, società partecipate, etc.).

      
      ## Modularità
      
      Il software è progettato in maniera modulare, allo scopo di essere adattabile 
      a qualunque amministrazione che sia interessata a dotarsi di uno scadenzario Open Source.
      
      Inoltre, le modalità tramite cui il software avvisa circa scadenze 
      e riepiloga le attività, possono estendersi a varie modalità:
          - e-mail
          - calendario condiviso
          - notifiche push
          - riepiloghi periodici creati in automatico in percorsi condivisi...
          - ...anche scaricabili on-demand in base all’input dell’utente.


      ## Riuso 

      Il software COL-GECO è sviluppato in Open Source e ciò permette a 
      chiunque sia interessato di poterne usufruire a volontà e godere anche 
      degli aggiornamenti futuri, se piace.
      
      Inoltre, è stato specificamente disegnato per essere il più semplice ed 
      intuitivo possibile, ed il suo uso può essere appreso in una singola sessione.

      Naturalmente, esistono attualmente strumenti gratuiti e ben realizzati 
      che però sono generalmente sviluppati da aziende americane, dunque 
      i dati personali e delle amministrazioni in essi caricati non sono 
      ben tracciati e controllati; l'adozione di tali strumenti ha dunque 
      possibili risvolti negativi in termini di privacy e trattamento 
      dei dati personali.
       
      Ad esempio, i dati personali della pianta organica dell’ateneo 
      o della amministrazione in generale potrebbero non essere trattati 
      in conformità con le normative europee.

      Il software COL-GECO offre invece, da questo punto di vista, una tutela 
      aggiuntiva, perché è pensato per essere installato in locale, senza
      inviare quindi dati in cloud.

      
      ## Conclusioni
      
      Il software COL-GECO può essere scaricato e provato senza impegno alcuno 
      e se ne può creare un’istanza al fine di verificare se l’interfaccia 
      e le funzionalità sono in linea con quanto richiesto e con quanto 
      ci si aspetta ai fini della gestione ottimale delle convenzioni 
      e degli altri elementi affini.

      L’estrema modularità e la semplicità di uso sono obiettivi che, a dispetto del risultato, 
      sono spesso ardui da realizzare e richiedono uno sforzo continuo da parte dello sviluppatore. 

