description:
  it:
    genericName: Applicazione Web
    localisedName: "COL-GeCo: Rischi On Line-Risk Mapping Software"
    shortDescription: 'Applicazione web per la gestione delle convenzioni della pubblica amministrazione.'
    longDescription: |
      Il software gestionale delle convenzioni (COL-GECO, ovvero Convenzioni On Line-Gestione Convenzioni) 
      è un software modulare che nasce dall’esigenza, interna alla Pubblica Amministrazione, di tracciare 
      accordi e convenzioni intercorrenti tra soggetti esterni e la PA stessa, 
      sia allo scopo di redigere un registro organizzato e sempre aggiornato, 
      sia al fine di ottenere uno scadenzario atto a informare e notificare 
      circa le prossime convenzioni in scadenza e in grado di erogare riepiloghi mensili 
      e fornire remind riguardo le scadenze imminenti.

      Attualmente, l'oggetto del software è la gestione delle convenzioni, 
      ma il software stesso è concepito con la mission di estendere progressivamente 
      il dominio agli altri oggetti di contratto e accordo con la PA.

      Il software è progettato in maniera modulare, allo scopo di essere adattabile 
      a qualunque amministrazione che sia interessata a dotarsi di uno scadenzario Open Source.
      Inoltre, le modalità tramite cui il software avvisa circa scadenze e riepiloga le attività, possono estendersi a varie modalità:
          - e-mail
          - calendario condiviso
          - notifiche push
          - riepiloghi periodici creati in automatico in percorsi condivisi
          - anche scaricabili on-demand in base all’input dell’utente
     
      Originariamente, la richiesta di sviluppare un software ad-hoc è partita 
      proprio dall’esigenza degli uffici, che non trovavano sufficiente appoggiarsi 
      ad uno strumento predefinito, in quanto già utilizzavano tipicamente, 
      oltre a calendari e applicazioni, anche le cartelle Excel per gestire le convenzioni.
      Un software come COL-GECO rappresenta invece un hub unico in cui, 
      una volta inserite le informazioni relative alle convenzioni, 
      tutto il workflow procede di conseguenza e senza necessità di ulteriore intervento 
      da parte degli operatori.  

      Il software COL-GECO è sviluppato in Open Source per permettere a chiunque 
      di poterne usufruire e godere degli aggiornamenti futuri, se piace, 
      senza necessità di pagare abbonamenti o stipulare contratti.
      Inoltre, è stato specificamente disegnato per essere il più semplice ed intuitivo possibile, 
      ed il suo uso può essere appreso in una singola sessione.

      Gli strumenti gratuiti e ben realizzati sono generalmente sviluppati da aziende americane 
      e i dati personali e delle amministrazioni in essi caricati non sono ben tracciati e controllati, 
      avendo possibili risvolti negativi in termini di privacy e trattamento dei dati personali. 
      Nel software bisogna caricare i dati personali della pianta organica dell’ateneo 
      o della amministrazione in generale e questi dati potrebbero essere trattati 
      non in conformità con le normative europee.

      Il software COL-GECO offre invece una tutela aggiuntiva rispetto al trattamento dei dati personali.

      Il software COL-GECO può essere scaricato e provato senza impegno alcuno 
      e se ne può creare un’istanza al fine di verificare se l’interfaccia e le funzionalità 
      sono in linea con quanto richiesto e con quanto ci si aspetta ai fini della gestione ottimale 
      delle convenzioni e degli altri elementi affini.

      L’estrema modularità e la semplicità di uso sono obiettivi che, a dispetto del risultato, 
      sono spesso ardui da realizzare e richiedono uno sforzo continuo da parte dello sviluppatore. 

